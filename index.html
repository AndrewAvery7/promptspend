<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptSpend — LLM API cost calculator for GPT, Claude and %MODEL_COUNT% models</title>
    <meta
      name="description"
      content="Estimate and compare what an AI feature will cost across %MODEL_COUNT% models. Paste your prompt, see every bill side by side — from prices re-checked every morning."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Absolute, and filled in at build time from SITE_URL. A canonical tag
         pointing at the wrong host is worse than none: it tells Google to index
         somewhere the site is not. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Bing Webmaster Tools ownership proof. Public by design — it only
         asserts that whoever controls this page also controls the Bing
         property. Google's equivalent is a DNS TXT record instead, added by
         its Cloudflare integration, which is why there is no pair to this. -->
    <meta name="msvalidate.01" content="E2F9327BED2C4CF9744B09833F560B72" />

    <!--
      GitHub Pages cannot set response headers, so the policy is declared here.
      The placeholder below is filled in at build time by the `promptspend-csp`
      plugin in vite.config.ts, from the same VITE_ALERTS_API value the app
      itself reads — a hand-written policy here would drift from the API origin
      the moment one of them moved. With no API configured it resolves to a
      strictly self-only policy; `connect-src` is what stops a compromised
      dependency exfiltrating a pasted prompt, which is the one genuinely
      sensitive thing this page holds. (Do not write the placeholder token
      anywhere above this tag: the build fills every occurrence.)
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2456e6" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1.5' y='1.5' width='23' height='23' rx='6' fill='none' stroke='%232456E6' stroke-width='2'/%3E%3Cpath d='M7 9.5h12M7 13.5h8M7 17.5h10' stroke='%232456E6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PromptSpend" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="PromptSpend — know the tab before you build" />
    <meta
      property="og:description"
      content="Compare LLM API costs across providers, from a catalog that re-checks itself every morning. Free, open source, no accounts, no analytics."
    />
    <!-- Previously absent entirely, so every share rendered as a bare link. The
         card is generated by tools/make-assets.py into public/, because assets/
         is repository documentation and is never served. -->
    <meta property="og:image" content="%SITE_URL%/social-card.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="PromptSpend — know the tab before you build. Three cost tiers: budget $723/mo, mid $2,417/mo, frontier $11,081/mo."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/social-card.png" />

    <!-- Structured data. Tells search engines this is a free web application
         rather than an article, which is what earns the richer result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PromptSpend",
        "url": "%SITE_URL%/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Estimate and compare LLM API costs across %MODEL_COUNT% models, from a pricing catalog that re-checks itself every morning against tracked sources.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/AndrewAvery7/promptspend"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      PromptSpend is an interactive calculator and needs JavaScript. The underlying pricing data is a plain
      JSON file you can read directly at
      <a href="./data/pricing.json">data/pricing.json</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
