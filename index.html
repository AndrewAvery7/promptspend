<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptSpend — LLM API cost calculator for GPT, Claude and %MODEL_COUNT% models</title>
    <meta
      name="description"
      content="Estimate and compare what an AI feature will cost across %MODEL_COUNT% models. Paste your prompt, see every bill side by side — from prices re-checked every morning."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Absolute, and filled in at build time from SITE_URL. A canonical tag
         pointing at the wrong host is worse than none: it tells Google to index
         somewhere the site is not. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="PromptSpend price changes"
      href="%SITE_URL%/feed.xml"
    />

    <!-- Bing Webmaster Tools ownership proof. Public by design — it only
         asserts that whoever controls this page also controls the Bing
         property. Google's equivalent is a DNS TXT record instead, added by
         its Cloudflare integration, which is why there is no pair to this. -->
    <meta name="msvalidate.01" content="E2F9327BED2C4CF9744B09833F560B72" />

    <!--
      GitHub Pages cannot set response headers, so the policy is declared here.
      The placeholder below is filled in at build time by the `promptspend-csp`
      plugin in vite.config.ts, from the same VITE_ALERTS_API value the app
      itself reads — a hand-written policy here would drift from the API origin
      the moment one of them moved. `connect-src` is what stops a compromised
      dependency exfiltrating a pasted prompt, which is the one genuinely
      sensitive thing this page holds, so it admits only this site, the alerts
      API and Turnstile when one is configured, and, only while Google
      Analytics is running (it has been paused since 2026-10-29), its tag host
      and named collection hosts (src/lib/analytics/config.ts). (Do not write the placeholder token
      anywhere above this tag: the build fills every occurrence.)
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2456e6" />
    <!-- Safari on iPhone turns this into its own "Open in the App Store" strip.
         It is Apple's native UI, drawn by the browser, not a script of ours. -->
    <meta name="apple-itunes-app" content="app-id=6800386428" />

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PromptSpend" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="PromptSpend — know the tab before you build" />
    <meta
      property="og:description"
      content="Compare LLM API costs across providers, from a catalog that re-checks itself every morning. Free, open source, no accounts, no ads."
    />
    <!-- Previously absent entirely, so every share rendered as a bare link. The
         card is generated by tools/make-assets.py into public/, because assets/
         is repository documentation and is never served. -->
    <meta property="og:image" content="%SITE_URL%/social-card.png?v=b75d1de1" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="PromptSpend — know the tab before you build. Three cost tiers: budget $1,087/mo, mid $3,522/mo, frontier $11,081/mo."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/social-card.png?v=b75d1de1" />

    <!-- Structured data. Tells search engines this is a free web application
         rather than an article, which is what earns the richer result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PromptSpend",
        "url": "%SITE_URL%/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Estimate and compare LLM API costs across %MODEL_COUNT% models, from a pricing catalog that re-checks itself every morning against tracked sources.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/AndrewAvery7/promptspend"
      }
    </script>
    <!-- Who is behind the site, for search engines: the organization, its
         public profiles (each a page that exists and links back), and the
         website itself. Nothing here is a claim about ratings or reviews. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "PromptSpend",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "sameAs": [
              "https://github.com/AndrewAvery7/promptspend",
              "https://www.npmjs.com/package/@promptspend/mcp",
              "https://marketplace.visualstudio.com/items?itemName=promptspend.promptspend",
              "https://open-vsx.org/extension/promptspend/promptspend",
              "https://apps.apple.com/app/id6800386428",
              "https://play.google.com/store/apps/details?id=com.promptspend.app"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "name": "PromptSpend",
            "url": "%SITE_URL%/",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- The LaunchNest and Fazier listing badges, in the HTML itself. Their
           verifiers read this page without running JavaScript (Fazier's, we
           assume, as LaunchNest's does), so a link drawn only by the React
           footer is invisible to them. React replaces everything inside #root
           on mount, and SiteFooter then draws the same badges, so they never
           show twice. Keep these in step with LAUNCHNEST_* and FAZIER_* in
           src/config.ts, and never give either link nofollow, sponsored or ugc:
           a listing is refused if its link carries any of them. LaunchNest's
           image must come from launchnest.io itself (their verifier refuses a
           local copy); the CSP admits that origin for images only. Fazier's is
           a self-hosted copy, which img-src 'self' already covers. -->
      <footer class="footer">
        <div class="footer__inner">
          <div class="footer__badge">
            <a href="https://launchnest.io/p/promptspend" target="_blank" rel="noopener noreferrer">
              <picture>
                <source
                  srcset="https://launchnest.io/badge/promptspend.svg?variant=featured"
                  media="(prefers-color-scheme: dark)"
                />
                <img
                  src="https://launchnest.io/badge/promptspend.svg?variant=featured&amp;theme=light"
                  alt="PromptSpend on LaunchNest"
                  width="157"
                  height="40"
                  referrerpolicy="no-referrer"
                />
              </picture>
            </a>
            <a href="https://fazier.com" target="_blank" rel="noopener noreferrer">
              <picture>
                <source srcset="/fazier-badge-dark.svg" media="(prefers-color-scheme: dark)" />
                <img src="/fazier-badge-light.svg" alt="PromptSpend on Fazier" width="94" height="40" />
              </picture>
            </a>
          </div>
        </div>
      </footer>
    </div>
    <!-- What a reader sees with no JavaScript, and what a crawler that does not
         run it is given: a heading, a description and the way into every other
         page. This used to be 36 words and no links, so the home page said
         nothing to them. It sits in <noscript> on purpose. Anything placed in
         #root shows for a moment on every visit before React replaces it and
         would shift the page; this is never drawn when scripts run.
         scripts/check-seo.ts requires the heading and the links below. -->
    <noscript>
      <h1>PromptSpend: what an LLM API call really costs</h1>
      <p>
        PromptSpend is a free price list and cost calculator for the APIs behind GPT, Claude, Gemini and other
        large language models. It compares %MODEL_COUNT% models side by side, and every price shows its source
        and the date it was last confirmed. There are no accounts and no ads. The calculator needs JavaScript;
        the prices are also plain pages and files you can read without it.
      </p>
      <ul>
        <li><a href="./models/">Every model, by price</a></li>
        <li><a href="./providers/">Prices by provider</a></li>
        <li><a href="./compare/">Head-to-head comparisons</a></li>
        <li><a href="./free-tiers/">Free API tiers, compared</a></li>
        <li><a href="./writing/">Writing and the monthly price reports</a></li>
        <li><a href="./data/">Open data: the catalog, the price history and the free tiers</a></li>
        <li><a href="./receipt/">PromptSpend Receipt</a></li>
        <li><a href="./app/">The iPhone and Android apps</a></li>
        <li><a href="./data/pricing.json">The price catalog as JSON</a></li>
        <li><a href="./llms.txt">An index for AI assistants</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
