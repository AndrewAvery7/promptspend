<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenTally — LLM cost estimator with pricing that re-checks itself daily</title>
    <meta
      name="description"
      content="Estimate, compare and understand what an AI feature will cost. Paste your prompt, pick up to four models, and see every bill side by side — from prices re-checked every morning against tracked sources."
    />
    <meta name="color-scheme" content="light dark" />

    <!--
      GitHub Pages cannot set response headers, so the policy is declared here.
      The placeholder below is filled in at build time by the `tokentally-csp`
      plugin in vite.config.ts, from the same VITE_ALERTS_API value the app
      itself reads — a hand-written policy here would drift from the API origin
      the moment one of them moved. With no API configured it resolves to a
      strictly self-only policy; `connect-src` is what stops a compromised
      dependency exfiltrating a pasted prompt, which is the one genuinely
      sensitive thing this page holds. (Do not write the placeholder token
      anywhere above this tag: the build fills every occurrence.)
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2456e6" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1.5' y='1.5' width='23' height='23' rx='6' fill='none' stroke='%232456E6' stroke-width='2'/%3E%3Cpath d='M7 9.5h12M7 13.5h8M7 17.5h10' stroke='%232456E6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TokenTally — know the tab before you build" />
    <meta
      property="og:description"
      content="Compare LLM API costs across providers, from a catalog that re-checks itself every morning. Free, open source, no accounts, no analytics."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      TokenTally is an interactive calculator and needs JavaScript. The underlying pricing data is a plain
      JSON file you can read directly at
      <a href="./data/pricing.json">data/pricing.json</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
