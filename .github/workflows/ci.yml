name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A single reusable gate. Both CI and the Pages deploy call this same job, so
  # there is exactly one definition of "verified" and no way to ship past it.
  verify:
    uses: ./.github/workflows/verify.yml
