name: Sync pricing

# The feature this project exists for: prices refresh themselves.
#
#   degraded run             -> nothing published; the health manifest records
#                               why and the job fails so it is visible
#   new review flag          -> raised as a pull request for a human
#   clean diff, no new flags -> committed to main, which redeploys the site
#
# Actions are pinned to commit SHAs, not tags: a tag is mutable, and this
# workflow has write access to the branch the site deploys from.
on:
  schedule:
    # 06:00 America/Chicago, give or take daylight saving.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch, merge and validate pricing
        id: sync
        run: npm run sync:pricing

      # The published data must satisfy the same schema the app enforces at
      # load, before anything is committed — not after.
      - name: Validate the merged catalog
        if: steps.sync.outputs.degraded != 'true'
        run: npx tsx scripts/validate-catalog.ts

      - name: Nothing changed
        if: steps.sync.outputs.degraded != 'true' && steps.sync.outputs.changed != 'true'
        run: echo "Sources stable — no update needed."

      # A degraded run still publishes its health manifest: "we tried and it
      # went wrong" is information visitors are entitled to.
      - name: Record a degraded run
        if: steps.sync.outputs.degraded == 'true'
        run: |
          git config user.name "tokentally-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/sync-status.json
          git diff --staged --quiet || git commit -m "chore: record degraded pricing sync"
          git push

      - name: Commit clean updates
        if: >-
          steps.sync.outputs.degraded != 'true' &&
          steps.sync.outputs.changed == 'true' &&
          steps.sync.outputs.needs_review != 'true'
        run: |
          git config user.name "tokentally-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/pricing.json public/data/sync-status.json docs/pricing-changelog.md
          git commit -m "data: ${{ steps.sync.outputs.summary }}"
          git push

      - name: Open a pull request when a human should look
        if: >-
          steps.sync.outputs.degraded != 'true' &&
          steps.sync.outputs.changed == 'true' &&
          steps.sync.outputs.needs_review == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: pricing-sync/${{ github.run_id }}
          commit-message: 'data: ${{ steps.sync.outputs.summary }} (needs review)'
          title: 'Pricing sync needs review: ${{ steps.sync.outputs.summary }}'
          body: |
            The daily sync produced a change that tripped a sanity rule **for the first time**.

            **Summary:** ${{ steps.sync.outputs.summary }}
            **Models tracked:** ${{ steps.sync.outputs.model_count }}
            **Currently flagged:** ${{ steps.sync.outputs.flagged_count }}

            A model is flagged when the two independent sources disagree by more
            than 20%, when a published price moved by more than 50% in a single
            day, or when it stopped appearing upstream. Long-standing flags do
            not re-open this PR every morning — only a reason that was not
            already recorded does.

            Check the flagged rows against the vendor's own pricing page before
            merging; if the vendor number is authoritative, add it to
            `data/pricing-overrides.json` (with `verifiedUrl`) rather than
            editing `pricing.json` directly.
          labels: pricing, needs-review

      # Last, so the manifest above is committed first: a degraded run should
      # still be loud.
      - name: Fail the run if the sources were degraded
        if: steps.sync.outputs.degraded == 'true'
        run: |
          echo "::error::Pricing sync was degraded — see public/data/sync-status.json for the reasons."
          exit 1
