name: Verify

# The one gate. `npm run verify` is typecheck + lint + format + tests with
# coverage thresholds + production build + catalog validation + bundle budget,
# and it is identical to what a contributor runs locally.
#
# Called by ci.yml on every push and pull request, and by deploy.yml *before*
# it publishes — a commit that fails any check cannot reach the live site.
on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded production build
        value: site

# Least privilege for GITHUB_TOKEN, applied to every job below. They check
# out the code, install, test and build; not one of them writes anything back.
# The e2e job uploads an artifact, which does not need repository write.
#
# Declared here rather than per job so a sixth job cannot be added and quietly
# inherit the repository default. Both callers already grant at least this much
# — a called workflow's permissions are capped by its caller, never raised.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          # Every lockfile, because the step below installs every workspace.
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci

      # `verify` now includes `check:test-badge`, and the number on that badge is
      # the sum of every workspace's suite — so this job has to be able to ask
      # each of them, not only the root package.
      #
      # Discovered rather than listed, for the same reason the script discovers
      # them: the set differs by branch. `vscode/` is on the extension branch and
      # not on `main`, so a hard-coded list here would be wrong on one of them.
      #
      # Nothing in these workspaces is *run* here. The check collects test names
      # without executing them, which is why this needs no workerd start and no
      # browser download. Each still gets its own job below, on its own runtime,
      # because that is where they are actually verified.
      - name: Install every workspace whose tests count toward the badge
        run: |
          for config in */vitest.config.*; do
            [ -e "$config" ] || continue
            (cd "$(dirname "$config")" && npm ci)
          done

      # Includes the colour-vision palette guarantee and the pricing-pipeline
      # rules, so a change that breaks either fails the build.
      - name: Verify
        env:
          # The single source of the alerts API origin. It feeds the client and
          # the generated Content Security Policy, so the built artifact is
          # already correct for whichever origin this repository is configured
          # with — unset simply builds a site with alerts switched off.
          VITE_ALERTS_API: ${{ vars.ALERTS_API }}
          # Set the repository variable BASE_PATH to "/" when the site moves to
          # a custom domain. Unset keeps the project-page default, /promptspend/.
          BASE_PATH: ${{ vars.BASE_PATH }}
          # Absolute origin the build is served from. Drives the canonical link,
          # the Open Graph tags, the structured data, robots.txt, sitemap.xml and
          # the Pages CNAME — so the domain cutover is this one value.
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run verify

      # Reused by the deploy job rather than rebuilt, so what is verified is
      # byte-for-byte what is published.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: dist
          retention-days: 1

  # The alerts worker is a separate package with its own runtime, so it gets its
  # own job rather than being bolted onto `npm run verify`. Its tests run inside
  # workerd against a real D1, which is slower to start and worth isolating.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Verify the alerts worker
        run: npm run verify

  # Layout, in a real browser at real viewport widths.
  #
  # Its own job because it needs a browser download and a built site, and
  # because its failures are a different kind: the unit suite runs in jsdom,
  # which has no layout engine, so it cannot see a table pushing the page
  # sideways on a phone or a control too small for a thumb. Both shipped here.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only. The mobile projects are Chromium contexts with touch
      # emulation, so WebKit and Firefox would triple the download to re-check
      # the same CSS.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The config builds the site itself, so this needs no separate build step
      # and cannot run against a stale dist/.
      - name: Mobile and layout checks
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The native iOS/Android client has its own Expo runtime and lockfile. A
  # successful website build says nothing about whether Metro can bundle the
  # same shared engine for Hermes, so typecheck/lint alone are not enough here.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: Verify Expo configuration and source
        run: |
          npm run test -- --ci
          npm run typecheck
          npm run lint
          npm run check:release
          npx expo-doctor

      - name: Bundle iOS, Android and web
        run: npx expo export --platform all --output-dir .expo/ci-export

  # The public pricing API. Separate again, and for the same reason: its own
  # runtime, its own lockfile, its own tests inside workerd.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Verify the pricing API
        run: npm run verify

  # The MCP server. Its own job for the same reasons as the API, plus one of
  # its own: `verify` here includes the context-footprint budget, which is a
  # product guarantee rather than a code-quality check. Tool definitions load
  # into the model's context on every turn, the README publishes the exact
  # number, and this job is what stops that number quietly becoming a lie.
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      # Typecheck, tests, and the footprint budget. The tests import the site's
      # own cost engine from ../src, so this also proves the server and the
      # website cannot report different numbers.
      - name: Verify the MCP server
        run: npm run verify

  # The VS Code extension. Its own job for the same reason as the MCP server:
  # own lockfile, own build target. The one thing this job cannot check is the
  # thing a reviewer most wants checked — whether a hover renders and whether
  # the inline annotation reads as useful or as clutter. That needs a human with
  # the .vsix installed, and the plan says so rather than pretending otherwise.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      # The root install, which this job genuinely needs and the MCP job does not.
      #
      # The extension typechecks `../src/lib/tokenize/index.ts` — a file that
      # belongs to the root package and imports `js-tiktoken`. TypeScript
      # resolves that from the importing file's own directory upwards, so it
      # looks in `<repo>/node_modules` and never in `vscode/node_modules`, and
      # without this step the typecheck fails on a module the extension has
      # correctly declared. It passed locally only because a root install
      # happened to be sitting there.
      #
      # Runtime resolution is the other way round: the bundle marks the
      # tokenizer external and the packaged extension carries its own copy. Both
      # are right; they are simply rooted differently.
      - name: Install the site's dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - run: npm ci

      # The tests import the site's catalog and cost engine from ../src, so a
      # green run here is also the proof that a price in the editor gutter and a
      # price on the website cannot disagree.
      - name: Verify the VS Code extension
        run: npm run verify
