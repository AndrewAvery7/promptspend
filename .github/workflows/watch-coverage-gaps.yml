name: Watch coverage gaps
# The capture rules in data/models-allowlist.json are patterns, and a pattern
# that is too narrow fails silently: on 2026-10-29 a comparison found OpenAI's
# GPT-5.x Pro tiers, Codestral and Kimi K3.1 Pro missing for that reason alone.
# This compares the catalog with another tracker's public model list once a
# week and opens one issue naming any model the price feed already carries under
# its maker's own key that no rule captures.
#
# The other list supplies names only; prices come from the feed, and anything
# captured still arrives through the daily sync, flagged for review. Read-only on
# the catalog: the issue is the whole output, and it closes itself once nothing
# is left. A model left out on purpose goes in data/coverage-ignore.json.
#
# Actions are pinned to commit SHAs, not tags, like every other workflow here.
on:
  schedule:
    # Mondays 12:45 UTC, after the later-additions watch.
    - cron: '45 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install reviewed dependencies only
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Compare the catalog with the other list and the feed
        id: watch
        run: npx tsx scripts/watch-coverage-gaps.ts

      - name: Open or refresh the issue, or close it when nothing is left
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FOUND: ${{ steps.watch.outputs.found }}
        run: |
          set -euo pipefail
          title='Coverage gaps: models the capture rules miss'
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')

          if [ "$FOUND" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file coverage-gaps-report.md
              echo "  refreshed issue #$existing"
            else
              gh issue create --title "$title" --body-file coverage-gaps-report.md --label pricing >/dev/null
              echo "  opened a new issue"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Nothing is left: every gap has been captured, published or recorded in data/coverage-ignore.json."
            echo "  closed issue #$existing"
          else
            echo "  no coverage gaps"
          fi
