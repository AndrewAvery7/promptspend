name: Publish to the MCP Registry

# Listing the server where agents actually look for it.
#
# The registry is the discovery surface `modelcontextprotocol/servers` retired
# its hand-maintained list in favour of, and the aggregators (Glama, PulseMCP)
# read it rather than the repository — so an unlisted server is invisible to
# them no matter how well the npm package is published.
#
# Authentication is OIDC, not a token: the `io.github.AndrewAvery7/*` namespace
# is owned by this repository, and GitHub asserts that directly. There is no
# secret to rotate and nothing to leak.
#
# Actions are pinned to commit SHAs for the same reason the sync workflow pins
# them: a tag is mutable, and this job speaks for the project's identity.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Three versions have to agree: the manifest the registry reads, the
      # package it points at, and the copy npm actually serves. A registry entry
      # that names a version npm does not have is a broken install for whoever
      # trusts the listing, and it fails at *their* machine rather than here.
      - name: Check the manifest, the package and npm agree
        run: |
          set -euo pipefail
          server_version=$(jq -r '.version' server.json)
          package_version=$(jq -r '.packages[0].version' server.json)
          npm_name=$(jq -r '.packages[0].identifier' server.json)
          local_version=$(jq -r '.version' mcp/package.json)
          local_name=$(jq -r '.name' mcp/package.json)
          mcp_name=$(jq -r '.mcpName' mcp/package.json)
          registry_name=$(jq -r '.name' server.json)

          fail() { echo "::error::$1"; exit 1; }

          [ "$server_version" = "$package_version" ] || \
            fail "server.json version ($server_version) != its own packages[0].version ($package_version)"
          [ "$server_version" = "$local_version" ] || \
            fail "server.json version ($server_version) != mcp/package.json version ($local_version)"
          [ "$npm_name" = "$local_name" ] || \
            fail "server.json identifier ($npm_name) != mcp/package.json name ($local_name)"
          [ "$mcp_name" = "$registry_name" ] || \
            fail "mcp/package.json mcpName ($mcp_name) != server.json name ($registry_name) — the registry rejects this"

          published=$(npm view "$npm_name@$server_version" version 2>/dev/null || true)
          [ "$published" = "$server_version" ] || \
            fail "npm has no $npm_name@$server_version yet — publish the package before listing it"

          echo "✓ $registry_name $server_version — manifest, package and npm agree"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Confirm the registry actually lists it
        run: |
          set -euo pipefail
          name=$(jq -r '.name' server.json)
          for attempt in 1 2 3 4 5; do
            sleep 5
            found=$(curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=promptspend" \
              | jq -r --arg n "$name" '.servers[]? | select(.name == $n) | .name' | head -1)
            if [ -n "$found" ]; then
              echo "✓ listed as $found"
              exit 0
            fi
            echo "  not visible yet (attempt $attempt)"
          done
          echo "::error::publish reported success but $name is not in the registry"
          exit 1
