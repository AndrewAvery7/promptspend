name: Watch later additions

# The catalog's rule is to wait for the automated price feed rather than
# hand-add a price that nothing can correct. A rule like that is only a policy
# if something notices the day the wait is over, and until this existed that was
# somebody remembering. data/later-additions.json lists what is waiting; this
# reads the feed once a week and opens one issue the week any of it appears.
#
# Read-only on the catalog: it adds nothing and publishes nothing. The issue
# is the whole output, and it closes itself once every listed item has been
# added, so a stale list never sits there asking to be ignored.
#
# Actions are pinned to commit SHAs, not tags, like every other workflow here.
on:
  schedule:
    # Mondays 12:30 UTC, after the weekend's syncs and the morning's catalog.
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install reviewed dependencies only
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Look for the waiting items in the feed
        id: watch
        run: npx tsx scripts/watch-later-additions.ts

      - name: Open or refresh the issue, or close it when nothing is left
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FOUND: ${{ steps.watch.outputs.found }}
        run: |
          set -euo pipefail
          title='Later additions now in the price feed'
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')

          if [ "$FOUND" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file later-additions-report.md
              echo "  refreshed issue #$existing"
            else
              gh issue create --title "$title" --body-file later-additions-report.md --label pricing >/dev/null
              echo "  opened a new issue"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Everything on the list has since been added to the catalog or has left the feed."
            echo "  closed issue #$existing"
          else
            echo "  nothing waiting is in the feed yet"
          fi
