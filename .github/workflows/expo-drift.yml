name: Expo drift check

# The one check in this repository whose verdict is decided by a registry
# rather than by the commit: `npx expo-doctor` compares the versions pinned
# in apps/mobile against a version map Expo serves at run time, so the day
# Expo ships new SDK 57 patch releases, this goes red without anything in the
# repository having changed.
#
# It used to close the mobile verify job, and through it every push and pull
# request: 2026-08-17, 08-18, 08-19 and 08-22 (when it still gated the Pages
# deploy), and again on 2026-09-01, the morning after a content-only report
# merged. A red X that appears for that reason is noise, and noise is how the
# real ones get missed — so it runs here, weekly, on its own.
#
# Since 2026-09-07 it also takes the patches itself (Andrew: "as hands-off as
# possible"). When expo-doctor reports drift, `npx expo install --fix` moves
# the pins to the versions Expo names for SDK 57 — the same command a54782b,
# 3231809 and ca8d2e4 were made with by hand — and the result is kept only if
# a clean install, the tests, typecheck, lint and expo-doctor all pass on it.
# Otherwise package.json and the lockfile go back and the run fails, which
# now means exactly one thing: the patches Expo shipped broke something, and
# a person has to look. Nothing deploys from this workflow and nothing gates
# on it. mobile-audit.yml runs half an hour later and re-derives the
# dependency triage against whatever this committed.
on:
  schedule:
    # Monday 14:00 UTC — 09:00 America/Chicago, give or take daylight saving.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install reviewed dependencies only
        run: |
          npm ci --ignore-scripts
          npm rebuild unrs-resolver

      - name: expo-doctor
        id: doctor
        continue-on-error: true
        run: npx expo-doctor

      # Only reached when the doctor found drift. `expo install --fix` writes
      # package.json and the lockfile; the gates below run on a fresh install
      # from that lockfile, not on whatever `expo install` left in node_modules.
      - name: Take the patch releases Expo names
        if: steps.doctor.outcome == 'failure'
        run: |
          npx expo install --fix
          if git diff --quiet -- package.json package-lock.json; then
            echo "expo-doctor failed but expo install --fix changed nothing — not a drift problem." >&2
            exit 1
          fi
          git diff --stat -- package.json package-lock.json

      - name: Prove the patched app still checks out
        if: steps.doctor.outcome == 'failure'
        id: gates
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm rebuild unrs-resolver
          # One retry: rehearsing this on 2026-09-07 the suite failed a single
          # test once in five runs on the same tree. A flicker must not turn
          # a good patch away; a real regression fails twice.
          npm test -- --ci || npm test -- --ci
          npm run typecheck
          npm run lint
          npx expo-doctor

      - name: Keep the patches
        if: steps.doctor.outcome == 'failure' && steps.gates.outcome == 'success'
        run: |
          git config user.name "promptspend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(mobile): clear expo-doctor patch drift"
          git push

      # The one case that asks for a person: Expo's own patch releases broke
      # the tests, the types, the lint or the doctor. The tree is put back so
      # the failure is visible without leaving a broken lockfile behind.
      - name: Put the tree back and fail
        if: steps.doctor.outcome == 'failure' && steps.gates.outcome != 'success'
        run: |
          git checkout -- package.json package-lock.json
          echo "The patch releases did not pass the gates; see the step above. Nothing was committed." >&2
          exit 1
